# Legacy desktop app: database configuration TEMPLATE.
#
# Copy this file to config.ini (same folder) and fill in your own values.
# config.ini is gitignored: never commit real hosts or passwords.

[oracle]

# Hostname or IP address of the Oracle database server
host = <db-host>

# Port number of the Oracle listener
port = 1521

# Service name of the WELBANK pluggable database
service_name = welbank

# Schema owner (the legacy app connects as this user for all data windows; see S-02)
admin_user = welbank

# Default user of the Customer Service department
cs_user = cs

# Default user of the Human Resources department
hr_user = hr

# Password shared by the users above (legacy design flaw, see S-01)
password = <password>


[database]

# dep_id values that belong to each big department
cs_dept_ids = 10, 20, 30
hr_dept_ids = 40, 50, 60
